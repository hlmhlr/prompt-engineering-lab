[project]
name = "promptlab"
version = "0.1.0"
description = "IBM's prompt engineering & LangChain PromptTemplates lab, rebuilt to run locally with Ollama and IBM Granite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlab"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
